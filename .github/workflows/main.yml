name: Cypress e2e tests

on:
  push:
  workflow_dispatch:

jobs: 
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: sandbox
      - name: Cypress run
        uses: cypress-io/github-action@v5
        with:
          browser: chrome
